server:
  port: 8084

spring:
  application:
    name: gl-supply
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:10.30.10.49:18848}
        namespace: dev
      config:
        server-addr: ${NACOS_ADDR:10.30.10.49:18848}
        namespace: dev
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.30.10.49}:3307/gl_supply?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:greenlink}
    password: ${MYSQL_PASS:GreenLink@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  data:
    redis:
      host: ${REDIS_HOST:10.30.10.49}
      port: 6382
      password: ${REDIS_PASS:GreenLink@2026}
      database: 0

  elasticsearch:
    uris: ${ES_URIS:http://10.30.10.49:9200}

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:10.30.10.49:9876}
  producer:
    group: gl-supply-producer-group
    send-message-timeout: 3000

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.greenlink.glsupply.domain
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info
