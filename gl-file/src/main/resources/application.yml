server:
  port: 8087

spring:
  application:
    name: gl-file
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:10.30.10.49:18848}
        namespace: dev
      config:
        server-addr: ${NACOS_ADDR:10.30.10.49:18848}
        namespace: dev
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.30.10.49}:3307/gl_common?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:greenlink}
    password: ${MYSQL_PASS:GreenLink@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  data:
    redis:
      host: ${REDIS_HOST:10.30.10.49}
      port: 6382
      password: ${REDIS_PASS:GreenLink@2026}
      database: 0

minio:
  endpoint: ${MINIO_ENDPOINT:http://10.30.10.49:9020}
  access-key: ${MINIO_ACCESS_KEY:greenlink}
  secret-key: ${MINIO_SECRET_KEY:GreenLink_MinIO@2026}
  bucket-name: ${MINIO_BUCKET:greenlink}
  public-bucket-name: ${MINIO_PUBLIC_BUCKET:greenlink-public}
  cdn-url: ${CDN_URL:}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.greenlink.glfile.domain
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info
