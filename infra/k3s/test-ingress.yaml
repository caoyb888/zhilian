# ---------------------------------------------------------
# 测试应用：验证 Nginx Ingress Controller 路由
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenlink-test-app
  namespace: greenlink-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenlink-test-app
  template:
    metadata:
      labels:
        app: greenlink-test-app
    spec:
      containers:
        - name: nginx
          image: docker.m.daocloud.io/library/nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: greenlink-test-app
  namespace: greenlink-dev
spec:
  selector:
    app: greenlink-test-app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: greenlink-test-ingress
  namespace: greenlink-dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: greenlink-test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: greenlink-test-app
                port:
                  number: 80
