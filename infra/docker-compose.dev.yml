version: '3.3'

services:
  mysql:
    image: mysql:8.0
    container_name: greenlink-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: GreenLink@2026
      MYSQL_DATABASE: gl_member
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
      - ./mysql/conf/greenlink.cnf:/etc/mysql/conf.d/greenlink.cnf:ro
      - ../db:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - greenlink-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pGreenLink@2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    container_name: greenlink-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - ./docker/data/redis:/data
    command: redis-server --appendonly yes --requirepass GreenLink@2026
    networks:
      - greenlink-net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: greenlink-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./docker/data/es:/usr/share/elasticsearch/data
    networks:
      - greenlink-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: greenlink-nacos
    restart: unless-stopped
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - NACOS_AUTH_ENABLE=false
      - TZ=Asia/Shanghai
    ports:
      - "18848:8848"
      - "19848:9848"
      - "19849:9849"
    volumes:
      - ./docker/data/nacos:/home/nacos/data
    networks:
      - greenlink-net

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: greenlink-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    volumes:
      - ./docker/data/rocketmq/namesrv:/home/rocketmq/logs
    command: nameserver
    networks:
      - greenlink-net

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: greenlink-rocketmq-broker
    restart: unless-stopped
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./docker/data/rocketmq/broker:/home/rocketmq/store
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
    command: broker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    depends_on:
      - rocketmq-namesrv
    networks:
      - greenlink-net

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: greenlink-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: greenlink
      MINIO_ROOT_PASSWORD: GreenLink@2026
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker/data/minio:/data
    command: server /data --console-address ":9001"
    networks:
      - greenlink-net

networks:
  greenlink-net:
    driver: bridge
