server:
  port: 8089

spring:
  application:
    name: gl-tag
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:10.30.10.49:18848}
        namespace: dev
      config:
        server-addr: ${NACOS_ADDR:10.30.10.49:18848}
        namespace: dev
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:10.30.10.49}:3307/gl_common?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:greenlink}
    password: ${MYSQL_PASS:GreenLink@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.greenlink.gltag.domain
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info
