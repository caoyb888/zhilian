name: Backend CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**' ]
    paths:
      - 'gl-*/**'
      - 'pom.xml'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'gl-*/**'
      - 'pom.xml'

jobs:
  build:
    name: Build & Test
    runs-on: [ self-hosted, linux, intranet ]
    timeout-minutes: 20

    env:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      PATH: /usr/lib/jvm/java-21-openjdk-amd64/bin:/usr/bin:/bin

    steps:
      - name: Configure git
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify environment
        run: |
          java -version
          mvn -version

      - name: Compile
        run: mvn compile -q --no-transfer-progress

      - name: Test
        run: mvn test --no-transfer-progress

      - name: Package
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: mvn package -DskipTests -q --no-transfer-progress

      - name: Upload artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            gl-*/target/*.jar
            !gl-*/target/*-sources.jar
          retention-days: 7

      - name: Notify result
        if: always()
        run: |
          echo "CI ${{ job.status }} | ${GITHUB_REF_NAME} | $(git log -1 --format='%s' | cut -c1-60)"
