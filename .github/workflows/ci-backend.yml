name: Backend CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**' ]
    paths:
      - 'gl-*/**'
      - 'pom.xml'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'gl-*/**'
      - 'pom.xml'

jobs:
  build:
    name: Build & Test
    runs-on: [ self-hosted, linux, intranet ]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn compile -q --no-transfer-progress

      - name: Test
        run: mvn test --no-transfer-progress

      - name: Package (skip tests, already ran)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        run: mvn package -DskipTests -q --no-transfer-progress

      - name: Upload artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            gl-*/target/*.jar
            !gl-*/target/*-sources.jar
          retention-days: 7

      - name: Notify result
        if: always()
        run: |
          STATUS=${{ job.status }}
          BRANCH=${GITHUB_REF_NAME}
          COMMIT=$(git log -1 --format='%s' | cut -c1-60)
          echo "CI $STATUS | $BRANCH | $COMMIT"

  # verified 2026-06-04
