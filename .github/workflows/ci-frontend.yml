name: Frontend CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**' ]
    paths:
      - 'green-link-web/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'green-link-web/**'

jobs:
  build:
    name: Build & Type Check
    runs-on: [ self-hosted, linux, intranet ]
    timeout-minutes: 15

    defaults:
      run:
        working-directory: green-link-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: green-link-web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://gateway.dev.greenlink.local

      - name: Upload dist
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: green-link-web/dist/
          retention-days: 7
