server:
  port: 8081

spring:
  application:
    name: gl-auth
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos.dev.greenlink.local:8848}
        namespace: dev
      config:
        server-addr: ${NACOS_ADDR:nacos.dev.greenlink.local:8848}
        namespace: dev
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql.dev.greenlink.local}:3306/gl_auth?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:greenlink}
    password: ${MYSQL_PASS:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:redis.dev.greenlink.local}
      port: 6379
      password: ${REDIS_PASS:}
      database: 0

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.greenlink.glauth.domain
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  secret: ${JWT_SECRET:gl-platform-secret-key-2026-change-in-prod}
  access-token-expire: 7200     # 2小时（秒）
  refresh-token-expire: 604800  # 7天（秒）

management:
  endpoints:
    web:
      exposure:
        include: health,info
