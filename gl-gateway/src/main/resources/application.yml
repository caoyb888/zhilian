server:
  port: 8080

spring:
  application:
    name: gl-gateway
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: gl-auth
          uri: ${GL_AUTH_URL:http://localhost:18081}
          predicates:
            - Path=/api/v1/auth/**
        - id: gl-member
          uri: ${GL_MEMBER_URL:http://localhost:18082}
          predicates:
            - Path=/api/v1/members/**,/api/v1/accounts/**
        - id: gl-member-rbac
          uri: ${GL_MEMBER_URL:http://localhost:18082}
          predicates:
            - Path=/api/v1/rbac/**
        - id: gl-portal
          uri: ${GL_PORTAL_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/portal/**,/api/v1/portal-categories/**
        - id: gl-tag
          uri: ${GL_TAG_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/tags/**,/api/v1/tag-categories/**
        - id: gl-supply
          uri: ${GL_SUPPLY_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/resources/**,/api/v1/demands/**
        - id: gl-match
          uri: ${GL_MATCH_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/matches/**,/api/v1/favorites/**
        - id: gl-message
          uri: ${GL_MESSAGE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/messages/**,/api/v1/notifications/**
        - id: gl-file
          uri: ${GL_FILE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/files/**
        - id: gl-admin
          uri: ${GL_ADMIN_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/admin/**
  data:
    redis:
      host: ${REDIS_HOST:10.30.10.49}
      port: 6382
      password: ${REDIS_PASS:GreenLink@2026}
      database: 0

jwt:
  secret: ${JWT_SECRET:gl-platform-secret-key-2026-change-in-prod}
  whitelist:
    - /api/v1/auth/login
    - /api/v1/auth/sms-login
    - /api/v1/auth/wechat-login
    - /api/v1/auth/refresh-token
    - /api/v1/auth/captcha
    - /api/v1/auth/sms-code
    - /api/v1/members/register
    - /api/v1/portal-categories
    - /api/v1/portal-categories/**
    - /api/v1/portal/articles
    - /api/v1/portal/articles/**
    - /api/v1/portal/activities
    - /api/v1/portal/activities/**
    - /api/v1/portal/banners
    - /api/v1/portal/banners/**
    - /api/v1/tag-categories
    - /api/v1/tag-categories/**
    - /api/v1/tags
    - /api/v1/tags/**
    - /api/v1/tag-relations
    - /actuator/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
