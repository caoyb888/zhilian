server:
  port: 8080

spring:
  application:
    name: gl-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:10.30.10.49:18848}
        namespace: dev
      config:
        server-addr: ${NACOS_ADDR:10.30.10.49:18848}
        namespace: dev
        file-extension: yaml
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: gl-auth
          uri: lb://gl-auth
          predicates:
            - Path=/api/v1/auth/**
        - id: gl-member
          uri: lb://gl-member
          predicates:
            - Path=/api/v1/members/**,/api/v1/accounts/**
        - id: gl-portal
          uri: lb://gl-portal
          predicates:
            - Path=/api/v1/articles/**,/api/v1/categories/**,/api/v1/activities/**
        - id: gl-supply
          uri: lb://gl-supply
          predicates:
            - Path=/api/v1/resources/**,/api/v1/demands/**
        - id: gl-match
          uri: lb://gl-match
          predicates:
            - Path=/api/v1/matches/**,/api/v1/favorites/**
        - id: gl-message
          uri: lb://gl-message
          predicates:
            - Path=/api/v1/messages/**,/api/v1/notifications/**
        - id: gl-tag
          uri: lb://gl-tag
          predicates:
            - Path=/api/v1/tags/**,/api/v1/tag-categories/**
        - id: gl-file
          uri: lb://gl-file
          predicates:
            - Path=/api/v1/files/**
        - id: gl-admin
          uri: lb://gl-admin
          predicates:
            - Path=/api/v1/admin/**
  data:
    redis:
      host: ${REDIS_HOST:10.30.10.49}
      port: 6382
      password: ${REDIS_PASS:GreenLink@2026}
      database: 0

jwt:
  secret: ${JWT_SECRET:gl-platform-secret-key-2026-change-in-prod}
  whitelist:
    - /api/v1/auth/login
    - /api/v1/auth/sms-login
    - /api/v1/auth/wechat-login
    - /api/v1/auth/refresh-token
    - /api/v1/auth/captcha
    - /api/v1/auth/sms-code
    - /api/v1/members/register
    - /api/v1/portal/**
    - /api/v1/tag-categories
    - /api/v1/tags
    - /api/v1/tag-relations
    - /actuator/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
