server:
  port: 8088

spring:
  application:
    name: gl-admin
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:10.30.10.49:18848}
        namespace: dev
      config:
        server-addr: ${NACOS_ADDR:10.30.10.49:18848}
        namespace: dev
        file-extension: yaml

gl:
  member:
    url: ${GL_MEMBER_URL:http://localhost:18082}
  supply:
    url: ${GL_SUPPLY_URL:http://localhost:8084}
  match:
    url: ${GL_MATCH_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
